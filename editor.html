<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Meet — редактор</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #202124;
      color: #e8eaed;
      padding: 32px;
    }
    h1 { font-size: 22px; margin: 0 0 4px; font-weight: 500; }
    h2 { font-size: 14px; margin: 24px 0 12px; font-weight: 500; color: #9aa0a6; text-transform: uppercase; letter-spacing: .5px; }
    .hint { color: #9aa0a6; font-size: 13px; margin-bottom: 16px; max-width: 800px; }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    button {
      background: #8ab4f8;
      color: #202124;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    button.secondary {
      background: transparent;
      color: #8ab4f8;
      border: 1px solid #5f6368;
    }
    .status { color: #9aa0a6; font-size: 13px; }
    .status.ok    { color: #81c995; }
    .status.err   { color: #f28b82; }

    .meeting-bar {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      background: #2d2e30;
      padding: 16px;
      border-radius: 10px;
      max-width: 1100px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field label {
      font-size: 12px;
      color: #9aa0a6;
    }
    .field input {
      background: #3c4043;
      color: #e8eaed;
      border: 1px solid transparent;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      min-width: 140px;
    }
    .field input:focus { outline: none; border-color: #8ab4f8; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      max-width: 1100px;
    }
    .slot {
      background: #2d2e30;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .slot.skipped { opacity: .45; }
    .slot .skip-tag {
      font-size: 11px;
      color: #fdd663;
      background: #3c2e10;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
    }
    .slot .original {
      font-size: 11px;
      color: #9aa0a6;
      word-break: break-all;
    }
    .preview {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #3c4043 url("assets/img/placeholder.svg") center/40% no-repeat;
      border-radius: 8px;
      overflow: hidden;
    }
    .preview img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .slot input[type=file] { display: none; }
    .row { display: flex; gap: 6px; align-items: center; }
    .row .file-btn,
    .row .clear-btn {
      background: #3c4043;
      color: #e8eaed;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      flex: 1;
      font-family: inherit;
      text-align: center;
    }
    .row .clear-btn { flex: 0 0 auto; }
  </style>
</head>
<body>
  <h1>Редактор Meet</h1>
  <p class="hint">
    Зміни зберігаються одразу у SQLite. Кнопка «Переглянути» відкриє сторінку
    зустрічі з усіма правками; «Зберегти HTML» скачає той самий результат як
    файл. Pavlo Grinevich і «3 others» лишаються без змін.
  </p>

  <div class="toolbar">
    <button id="preview">Переглянути</button>
    <button id="save">Зберегти HTML</button>
    <span id="status" class="status"></span>
  </div>

  <h2>Параметри зустрічі</h2>
  <div class="meeting-bar">
    <div class="field">
      <label for="f-time">Час</label>
      <input id="f-time" placeholder="10:34">
    </div>
    <div class="field">
      <label for="f-period">Період</label>
      <input id="f-period" placeholder="PM" maxlength="2" style="min-width:60px">
    </div>
    <div class="field">
      <label for="f-code">Код зустрічі</label>
      <input id="f-code" placeholder="yrt-kczi-csw">
    </div>
  </div>

  <h2>Учасники</h2>
  <div class="grid" id="grid"></div>

  <script>
    const statusEl = document.getElementById("status");
    const grid = document.getElementById("grid");
    const previewBtn = document.getElementById("preview");
    const saveBtn = document.getElementById("save");
    let previewWin = null;
    let statusTimer = null;

    function setStatus(msg, cls = "") {
      statusEl.textContent = msg;
      statusEl.className = "status " + cls;
      if (statusTimer) clearTimeout(statusTimer);
      if (cls === "ok") {
        statusTimer = setTimeout(() => { statusEl.textContent = ""; statusEl.className = "status"; }, 1800);
      }
    }

    async function api(method, path, body) {
      const opts = { method };
      if (body !== undefined) {
        opts.headers = { "Content-Type": "application/json" };
        opts.body = JSON.stringify(body);
      }
      const r = await fetch(path, opts);
      if (!r.ok) throw new Error(`${method} ${path} → ${r.status}`);
      const ct = r.headers.get("Content-Type") || "";
      return ct.includes("json") ? r.json() : r.text();
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    // ─── налаштування зустрічі ─────────────────────────────────────────
    const settingFields = {
      time:         document.getElementById("f-time"),
      period:       document.getElementById("f-period"),
      meeting_code: document.getElementById("f-code"),
    };

    async function loadSettings() {
      const s = await api("GET", "/api/settings");
      for (const [k, el] of Object.entries(settingFields)) {
        el.value = s[k] || "";
      }
    }

    for (const [k, el] of Object.entries(settingFields)) {
      el.addEventListener("change", async () => {
        try {
          await api("PUT", "/api/settings", { [k]: el.value });
          setStatus("Збережено", "ok");
        } catch (e) { setStatus(e.message, "err"); }
      });
    }

    // ─── учасники ──────────────────────────────────────────────────────
    function slotTemplate(p) {
      const skipped = p.skipped ? " skipped" : "";
      const skipTag = p.skipped ? `<span class="skip-tag">пропускаємо</span>` : "";
      return `
        <div class="slot${skipped}" data-id="${p.device_id}">
          ${skipTag}
          <div class="field">
            <label>Ім'я</label>
            <input class="name-input" type="text" ${p.skipped ? "disabled" : ""}>
          </div>
          <div class="original">оригінал: ${escapeHtml(p.original_name)}</div>
          <div class="preview">
            ${p.has_avatar ? `<img src="/api/avatar/${encodeURIComponent(p.device_id)}?t=${Date.now()}">` : ""}
          </div>
          <div class="row">
            <label class="file-btn">
              ${p.has_avatar ? "Замінити" : "Завантажити фото"}
              <input type="file" accept="image/*" ${p.skipped ? "disabled" : ""}>
            </label>
            <button type="button" class="clear-btn" ${p.has_avatar ? "" : "hidden"}>×</button>
          </div>
        </div>
      `;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    }

    async function loadParticipants() {
      const list = await api("GET", "/api/participants");
      grid.innerHTML = list.map(slotTemplate).join("");
      for (const p of list) wireSlot(p);
    }

    function wireSlot(p) {
      const slot = grid.querySelector(`.slot[data-id="${cssEsc(p.device_id)}"]`);
      if (!slot) return;
      const nameInput = slot.querySelector(".name-input");
      const fileInput = slot.querySelector("input[type=file]");
      const clearBtn = slot.querySelector(".clear-btn");
      const preview  = slot.querySelector(".preview");
      const fileBtn  = slot.querySelector(".file-btn");

      nameInput.value = p.custom_name || "";
      nameInput.placeholder = p.original_name || "";

      nameInput.addEventListener("change", async () => {
        try {
          await api("PUT", `/api/participants/${encodeURIComponent(p.device_id)}`,
                    { custom_name: nameInput.value || null });
          setStatus("Збережено", "ok");
        } catch (e) { setStatus(e.message, "err"); }
      });

      fileInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const dataUrl = await fileToDataUrl(file);
        try {
          await api("PUT", `/api/participants/${encodeURIComponent(p.device_id)}`,
                    { avatar_data_url: dataUrl });
          preview.innerHTML = `<img src="/api/avatar/${encodeURIComponent(p.device_id)}?t=${Date.now()}">`;
          clearBtn.hidden = false;
          fileBtn.firstChild.textContent = " Замінити ";
          setStatus("Збережено", "ok");
        } catch (e2) { setStatus(e2.message, "err"); }
        fileInput.value = "";
      });

      clearBtn.addEventListener("click", async () => {
        try {
          await api("PUT", `/api/participants/${encodeURIComponent(p.device_id)}`,
                    { avatar_data_url: null });
          preview.innerHTML = "";
          clearBtn.hidden = true;
          fileBtn.firstChild.textContent = " Завантажити фото ";
          setStatus("Прибрано", "ok");
        } catch (e) { setStatus(e.message, "err"); }
      });
    }

    function cssEsc(s) {
      return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/(["\\])/g, "\\$1");
    }

    // ─── preview / save ────────────────────────────────────────────────
    previewBtn.addEventListener("click", () => {
      const url = `/api/render?t=${Date.now()}`;
      if (!previewWin || previewWin.closed) {
        previewWin = window.open(url, "meet-preview");
      } else {
        previewWin.location.replace(url);
        previewWin.focus();
      }
    });

    saveBtn.addEventListener("click", () => {
      window.location.href = "/api/render?download=1";
    });

    // ─── init ─────────────────────────────────────────────────────────
    Promise.all([loadSettings(), loadParticipants()]).catch(e => setStatus(e.message, "err"));
  </script>
</body>
</html>
