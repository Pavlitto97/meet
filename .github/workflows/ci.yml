name: CI

# Перевірка на PR/пуш (НЕ реліз): збірка renderer+main (vite+tsc = і тайпчек) та
# Playwright E2E-smoke на цільових платформах. Релізні збірки (NSIS/dmg) — окремо
# у release.yml на тег v*. Тут інсталятор НЕ потрібен: тест піднімає зібраний
# out/main/index.js напряму через electron (args:['.']).
on:
  pull_request:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/ci.yml']
  push:
    branches: [main, electron-rewrite]
    paths: ['desktop/**', '.github/workflows/ci.yml']
  workflow_dispatch:

# Новий пуш у ту саму гілку/PR скасовує попередній прогін.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest] # цільові платформи (як у release.yml)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build (renderer + main)
        run: npm run build

      # Бінарник Electron на чистому CI ненадійний: npm-пакет electron@42 не має
      # власного postinstall, а isInstalled() часом «бачить» стале path.txt без
      # самого бінарника → Playwright _electron.launch падає ENOENT (path.txt).
      # Форсимо ЧИСТЕ завантаження бінарника (rm + force_no_cache) ПІСЛЯ білда,
      # перед тестом, і верифікуємо, що executable на місці. shell:bash → працює
      # і на windows-latest (Git Bash). Браузери Playwright не ставимо (Electron-тести
      # ганяють власний electron-бінарник).
      - name: Ensure Electron binary
        shell: bash
        run: |
          rm -rf node_modules/electron/dist node_modules/electron/path.txt
          force_no_cache=true node node_modules/electron/install.js
          node -e "const p=require('electron'),fs=require('fs');if(typeof p!=='string'||!fs.existsSync(p)){console.error('Electron binary MISSING at',p);process.exit(1)}console.log('Electron OK:',p)"

      # CI=true (GitHub Actions) → reporter github + html (див. playwright.config.ts).
      - name: E2E (Playwright)
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: desktop/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
