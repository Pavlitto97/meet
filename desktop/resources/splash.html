<html lang="uk">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Google Sans', Roboto, system-ui, -apple-system, sans-serif;
    user-select: none;
    -webkit-app-region: drag;
  }
  .card {
    box-sizing: border-box;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #202124;
    border: 1px solid #3c4043;
    border-radius: 20px;
    padding: 32px;
  }
  .title {
    color: #e8eaed;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: .25px;
  }
</style>

<body>
  <div class="card">
    <div class="title">Meet Editor</div>
  </div>
