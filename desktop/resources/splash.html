<!doctype html>
<!-- Сплеш-прелоадер: показується миттєво при старті, поки main-вікно вантажиться
     (мінімум 1 с — див. src/main/index.ts). Самодостатній: інлайн-стилі, без JS. -->
<html lang="uk">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Google Sans', Roboto, system-ui, -apple-system, sans-serif;
    user-select: none;
    -webkit-app-region: drag;
  }
  .card {
    box-sizing: border-box;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: #202124;
    border: 1px solid #3c4043;
    border-radius: 20px;
    padding: 32px;
  }
  .avatar {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    overflow: hidden;
    background: radial-gradient(circle at 30% 25%, #303134, #28292c 70%);
    box-shadow: 0 0 0 3px #8ab4f8, 0 8px 28px rgba(0, 0, 0, .45);
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    /* Обрізаний бюст на прозорому тлі — притискаємо до низу кола. */
    object-position: center bottom;
    display: block;
  }
  .title {
    color: #e8eaed;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: .25px;
  }
  .spinner {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 3px solid rgba(138, 180, 248, .25);
    border-top-color: #8ab4f8;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar"><img src="splash.png" alt=""></div>
    <div class="title">Meet Editor</div>
    <div class="spinner"></div>
  </div>
</body>
</html>
